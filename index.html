<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>🔥 減脂計劃</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap');
:root{--bg:#0f1117;--sf:#181c27;--cd:#1e2336;--bd:#2a3050;--ac:#6c63ff;--a2:#ff6b6b;--a3:#43d99e;--a4:#ffd166;--tx:#e8eaf0;--mt:#7a85a3;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:"Noto Sans TC",sans-serif;min-height:100vh;max-width:480px;margin:0 auto;}
#pin-screen{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;align-items:center;justify-content:center;}
.pin-box{background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:36px;width:90%;max-width:320px;text-align:center;}
.pin-logo{font-size:2.4rem;margin-bottom:8px;}
.pin-title{font-family:"Space Grotesk",sans-serif;font-size:1.3rem;font-weight:700;margin-bottom:4px;}
.pin-sub{color:var(--mt);font-size:.8rem;margin-bottom:24px;}
.pin-dots{display:flex;justify-content:center;gap:14px;margin-bottom:22px;}
.pin-dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--bd);transition:all .2s;}
.pin-dot.filled{background:var(--ac);border-color:var(--ac);}
.pin-dot.error{background:var(--a2);border-color:var(--a2);}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:220px;margin:0 auto;}
.pin-btn{padding:15px;border:1px solid var(--bd);border-radius:11px;background:var(--sf);color:var(--tx);font-family:"Space Grotesk",sans-serif;font-size:1.2rem;font-weight:600;cursor:pointer;transition:background .1s;-webkit-tap-highlight-color:transparent;}
.pin-btn:active{background:var(--bd);}
.pin-err{color:var(--a2);font-size:.76rem;margin-top:10px;min-height:18px;}
.pin-hint{color:var(--mt);font-size:.7rem;margin-top:6px;}
#app{display:none;padding-bottom:72px;}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--sf);border-top:1px solid var(--bd);display:flex;z-index:100;}
.bnav-btn{flex:1;padding:10px 4px 8px;border:none;background:transparent;color:var(--mt);font-size:.6rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;-webkit-tap-highlight-color:transparent;transition:color .15s;}
.bnav-btn .icon{font-size:1.25rem;}
.bnav-btn.active{color:var(--ac);}
.hdr{padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between;}
.hdr-logo{font-family:"Space Grotesk",sans-serif;font-size:1rem;font-weight:700;color:var(--ac);}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--a3);display:inline-block;margin-right:4px;transition:background .3s;}
.sync-dot.off{background:var(--a4);}
.sync-txt{font-size:.68rem;color:var(--mt);}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:0 12px 12px;}
.card-title{font-size:.8rem;font-weight:600;margin-bottom:10px;color:var(--mt);}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 12px 12px;}
.stat{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:11px;text-align:center;}
.stat .v{font-family:"Space Grotesk",sans-serif;font-size:1.25rem;font-weight:700;margin-bottom:2px;}
.stat .l{font-size:.64rem;color:var(--mt);}
.phase{margin:0 12px 12px;border-radius:12px;padding:11px 13px;border-left:4px solid;}
.phase-title{font-size:.8rem;font-weight:700;margin-bottom:4px;}
.phase-row{display:flex;gap:12px;flex-wrap:wrap;font-size:.72rem;color:var(--mt);}
.phase-row strong{color:var(--tx);}
.wt-row{display:flex;align-items:center;gap:8px;}
.wt-inp{flex:1;padding:9px 12px;background:var(--sf);border:1px solid var(--bd);border-radius:9px;color:var(--tx);font-size:.9rem;font-family:"Space Grotesk",sans-serif;font-weight:600;}
.wt-inp:focus{outline:none;border-color:var(--ac);}
.btn-save{padding:9px 16px;background:linear-gradient(135deg,var(--ac),#9b59f7);border:none;border-radius:9px;color:#fff;font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap;}
.btn-sm{padding:6px 12px;background:transparent;border:1px solid var(--bd);border-radius:8px;color:var(--mt);font-size:.72rem;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s;}
.btn-sm:active{border-color:var(--ac);color:var(--ac);}
.meal-slot{padding:11px 14px;border-bottom:1px solid var(--bd);cursor:pointer;-webkit-tap-highlight-color:transparent;}
.meal-slot:last-child{border-bottom:none;}
.meal-slot-hdr{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
.meal-time{font-size:.68rem;color:var(--mt);min-width:38px;}
.meal-label{font-size:.7rem;color:var(--mt);}
.meal-name{font-size:.82rem;font-weight:600;flex:1;}
.meal-kcal{font-size:.66rem;color:var(--a3);}
.meal-detail{display:none;font-size:.75rem;color:var(--mt);line-height:1.7;margin-top:5px;padding-top:5px;border-top:1px solid rgba(255,255,255,.06);}
.meal-detail.open{display:block;}
.snack-tag{font-size:.62rem;padding:2px 6px;border-radius:9px;background:rgba(67,217,158,.15);color:var(--a3);}
.week-tabs{display:flex;gap:4px;padding:0 12px;margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.week-tab{padding:5px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--sf);color:var(--mt);font-size:.73rem;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:all .15s;}
.week-tab.active{background:var(--ac);color:#fff;border-color:var(--ac);}
.bk-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.bk-card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .15s;}
.bk-card.today-bk{border-color:var(--a3);background:rgba(67,217,158,.07);}
.bk-card:active{border-color:var(--ac);}
.bk-icon{font-size:1.5rem;margin-bottom:5px;}
.bk-name{font-size:.8rem;font-weight:600;margin-bottom:3px;}
.bk-desc{font-size:.7rem;color:var(--mt);line-height:1.4;}
.bk-kcal{font-size:.67rem;color:var(--a3);margin-top:5px;}
.mdc{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px;cursor:pointer;-webkit-tap-highlight-color:transparent;margin-bottom:7px;transition:border-color .15s;}
.mdc:active{border-color:var(--ac);}
.mdc-top{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.mdc-day{font-size:.65rem;font-weight:700;color:var(--ac);}
.mdc-badge{font-size:.58rem;padding:1px 5px;border-radius:6px;}
.box-b{background:rgba(255,209,102,.2);color:var(--a4);}
.home-b{background:rgba(108,99,255,.15);color:var(--ac);}
.cheat-b{background:rgba(255,107,107,.2);color:var(--a2);}
.mdc-dish{font-size:.74rem;color:var(--mt);line-height:1.5;}
.mdc-hint{font-size:.62rem;color:var(--a3);margin-top:4px;}
.ex-card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:7px;}
.ex-hdr{padding:11px 13px;cursor:pointer;display:flex;align-items:center;gap:10px;-webkit-tap-highlight-color:transparent;}
.ex-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:#0f1117;flex-shrink:0;}
.ex-info{flex:1;}
.ex-name{font-size:.8rem;font-weight:600;margin-bottom:2px;}
.ex-why{font-size:.7rem;color:var(--mt);}
.ex-meta{text-align:right;flex-shrink:0;}
.ex-time{font-size:.7rem;font-weight:700;}
.ex-sets{font-size:.66rem;color:var(--mt);}
.ex-body{display:none;padding:0 13px 12px;border-top:1px solid var(--bd);}
.ex-body.open{display:block;}
.ex-step{display:flex;gap:8px;margin-top:8px;}
.ex-snum{width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:#0f1117;flex-shrink:0;margin-top:2px;}
.ex-stxt .sn{font-size:.76rem;font-weight:600;margin-bottom:2px;}
.ex-stxt .sd{font-size:.72rem;color:var(--mt);line-height:1.5;}
.ex-tip{margin-top:8px;background:var(--bg);border-radius:7px;padding:7px 10px;font-size:.7rem;color:var(--mt);}
.wo-flow{display:flex;flex-direction:column;gap:6px;}
.wo-item{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;}
.wo-item.main-day{border-color:var(--ac);}
.wo-dot{width:8px;height:8px;border-radius:50%;background:var(--mt);flex-shrink:0;}
.wo-dot.main{background:var(--ac);}
.wo-dot.light{background:var(--a4);}
.wo-info{flex:1;}
.wo-day{font-size:.68rem;font-weight:700;color:var(--mt);margin-bottom:2px;}
.wo-name{font-size:.78rem;font-weight:600;}
.wo-det{font-size:.68rem;color:var(--mt);}
.shop-sec-title{font-size:.74rem;font-weight:600;padding:6px 12px 5px;margin:0 0 4px;color:var(--mt);border-bottom:1px solid var(--bd);}
.shop-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.04);font-size:.78rem;}
.shop-item input[type=checkbox]{accent-color:var(--ac);width:16px;height:16px;flex-shrink:0;cursor:pointer;}
.shop-item.bought span.sname{text-decoration:line-through;opacity:.4;}
.pantry-sel{font-size:.68rem;padding:2px 4px;border-radius:6px;background:var(--sf);border:1px solid var(--bd);color:var(--tx);cursor:pointer;margin-left:auto;flex-shrink:0;}
.shop-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 12px 10px;}
.shop-stat{background:var(--cd);border:1px solid var(--bd);border-radius:9px;padding:9px;text-align:center;}
.shop-stat .v{font-family:"Space Grotesk",sans-serif;font-size:1.1rem;font-weight:700;}
.shop-stat .l{font-size:.62rem;color:var(--mt);}
.setting-row{display:flex;align-items:center;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.05);}
.setting-label{flex:1;font-size:.8rem;}
.setting-val input,.setting-val select{padding:6px 9px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:.78rem;font-family:"Noto Sans TC",sans-serif;text-align:right;}
.setting-val input{width:95px;}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:150;align-items:flex-end;justify-content:center;}
.modal-bg.open{display:flex;}
.modal-box{background:var(--cd);border-radius:18px 18px 0 0;padding:18px;width:100%;max-width:480px;max-height:82vh;overflow-y:auto;}
.modal-handle{width:34px;height:4px;border-radius:2px;background:var(--bd);margin:0 auto 12px;}
.modal-title{font-size:.92rem;font-weight:700;margin-bottom:10px;}
.modal-close{float:right;background:none;border:none;color:var(--mt);font-size:1rem;cursor:pointer;margin-top:-2px;}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:9px 16px;font-size:.79rem;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;z-index:300;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.ok{border-color:rgba(67,217,158,.4);color:var(--a3);}
#toast.err{border-color:rgba(255,107,107,.4);color:var(--a2);}
</style>
</head>
<body>
<div id="pin-screen">
  <div class="pin-box">
    <div class="pin-logo">🔥</div>
    <div class="pin-title">我的減脂計劃</div>
    <div class="pin-sub" id="pin-sub">輸入 4 位 PIN 碼</div>
    <div class="pin-dots">
      <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
    </div>
    <div class="pin-grid" id="pin-grid">
      <button class="pin-btn" data-pin="1">1</button><button class="pin-btn" data-pin="2">2</button><button class="pin-btn" data-pin="3">3</button>
      <button class="pin-btn" data-pin="4">4</button><button class="pin-btn" data-pin="5">5</button><button class="pin-btn" data-pin="6">6</button>
      <button class="pin-btn" data-pin="7">7</button><button class="pin-btn" data-pin="8">8</button><button class="pin-btn" data-pin="9">9</button>
      <button class="pin-btn" data-pin="reset" style="font-size:.7rem;color:var(--mt)">忘記</button>
      <button class="pin-btn" data-pin="0">0</button>
      <button class="pin-btn" data-pin="del">⌫</button>
    </div>
    <div class="pin-err" id="pin-err"></div>
    <div class="pin-hint" id="pin-hint"></div>
  </div>
</div>
<div id="app">
  <div class="hdr">
    <div class="hdr-logo">🔥 減脂計劃</div>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="sync-dot" id="sdot"></span><span class="sync-txt" id="stxt">本地</span>
      <button class="btn-sm" onclick="lockApp()">🔒</button>
    </div>
  </div>
  <div id="t-home">
    <div id="phase-banner" class="phase" style="display:none"></div>
    <div class="stats" id="stats-row"></div>
    <div class="card">
      <div class="card-title">⚖️ 今日體重</div>
      <div class="wt-row">
        <input class="wt-inp" type="number" id="wt-inp" placeholder="輸入體重 kg" step="0.1" inputmode="decimal"/>
        <button class="btn-save" onclick="saveWeight()">儲存</button>
      </div>
    </div>
    <div style="padding:0 12px 5px;font-size:.78rem;font-weight:600;color:var(--mt)">📅 今日飲食計劃</div>
    <div id="today-meals" style="background:var(--cd);border:1px solid var(--bd);border-radius:14px;margin:0 12px 12px;overflow:hidden"></div>
    <!-- Today workout -->
    <div class="card" id="today-wo-card">
      <div class="card-title">💪 今日有氧運動</div>
      <div id="today-wo"></div>
    </div>
    <!-- Tomorrow prep -->
    <div class="card" id="tmr-card">
      <div class="card-title">🌙 明日備餐提醒（今晚準備）</div>
      <div id="tmr-prep"></div>
    </div>
    <div class="card"><div class="card-title">📈 本週小結</div><div id="week-summary"></div></div>
  </div>
  <div id="t-meal" style="display:none">
    <div style="padding:12px 12px 6px;font-size:.88rem;font-weight:700">🥗 飲食計劃</div>
    <div class="card"><div class="card-title">🌅 早餐：Herbalife 奶昔</div><div class="bk-grid" id="bk-grid"></div></div>
    <div style="padding:0 12px 6px;font-size:.78rem;font-weight:600;color:var(--mt)">☀️🌙 午餐 + 晚餐（28天輪替）</div>
    <div class="week-tabs" id="week-tabs"></div>
    <div id="meal-list" style="padding:0 12px 4px"></div>
  </div>
  <div id="t-wo" style="display:none">
    <div style="padding:12px 12px 6px;font-size:.88rem;font-weight:700">💪 運動計劃</div>
    <div class="card">
      <div class="card-title">🛏️ 早晨床上運動（每天10分鐘）</div>
      <div style="background:rgba(108,99,255,.08);border-radius:9px;padding:9px 12px;margin-bottom:10px;font-size:.76rem;color:var(--mt)">醒來先做完，啟動代謝。<strong style="color:var(--tx)">點擊展開詳細步驟。</strong></div>
      <div id="morning-ex"></div>
    </div>
    <div class="card"><div class="card-title">📅 每週安排</div><div class="wo-flow" id="wo-grid"></div></div>
    <div class="card"><div class="card-title">🔥 燃脂效率排名</div><div id="burn-rank" style="font-size:.78rem;line-height:2.2;color:var(--mt)"></div></div>
  </div>
  <div id="t-shop" style="display:none">
    <div style="padding:12px 12px 6px;font-size:.88rem;font-weight:700">🛒 購物清單</div>
    <div class="card" style="padding:11px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <button class="btn-sm" onclick="prevShopWeek()">◀</button>
        <div style="flex:1;text-align:center">
          <div style="font-family:'Space Grotesk',sans-serif;font-size:.88rem;font-weight:700" id="shop-week-lbl"></div>
          <div style="font-size:.68rem;color:var(--mt)" id="shop-week-range"></div>
        </div>
        <button class="btn-sm" onclick="nextShopWeek()">▶</button>
      </div>
      <div style="font-size:.72rem;color:var(--mt)" id="shop-recipe-lbl"></div>
    </div>
    <div class="shop-stats" id="shop-stats"></div>
    <div style="display:flex;gap:7px;margin:0 12px 10px;flex-wrap:wrap">
      <button class="btn-sm" onclick="autoUpdatePantry()">✅ 採購完成→更新庫存</button>
      <button class="btn-sm" onclick="clearBuyList()">🔄 重置清單</button>
      <button class="btn-sm" onclick="saveShopToSheets()">☁️ 備份到 Sheets</button>
    </div>
    <div id="shop-list"></div>
    <div id="shop-msg" style="text-align:center;font-size:.74rem;color:var(--a3);padding:8px;display:none"></div>
  </div>
  <div id="t-settings" style="display:none">
    <div style="padding:12px 12px 6px;font-size:.88rem;font-weight:700">⚙️ 設定</div>
    <div class="card" style="padding:0;overflow:hidden">
      <div class="setting-row"><div><div class="setting-label">📅 計劃開始日期</div></div><div class="setting-val"><input type="date" id="p-start"/></div></div>
      <div class="setting-row"><div><div class="setting-label">🎯 計劃天數</div></div><div class="setting-val"><input type="number" id="p-days" value="90" min="30" max="365"/></div></div>
      <div class="setting-row"><div><div class="setting-label">📏 身高 (cm)</div></div><div class="setting-val"><input type="number" id="p-height" placeholder="165"/></div></div>
      <div class="setting-row"><div><div class="setting-label">🎯 目標體重 (kg)</div></div><div class="setting-val"><input type="number" id="p-goal" placeholder="70" step="0.1"/></div></div>
      <div class="setting-row"><div><div class="setting-label">🌅 早餐時間</div></div><div class="setting-val"><input type="time" id="t-bk" value="07:30"/></div></div>
      <div class="setting-row"><div><div class="setting-label">🍎 上午加餐</div></div><div class="setting-val"><input type="time" id="t-am" value="10:30"/></div></div>
      <div class="setting-row"><div><div class="setting-label">☀️ 午餐時間</div></div><div class="setting-val"><input type="time" id="t-lu" value="12:30"/></div></div>
      <div class="setting-row"><div><div class="setting-label">🫐 下午加餐</div></div><div class="setting-val"><input type="time" id="t-pm" value="15:30"/></div></div>
      <div class="setting-row"><div><div class="setting-label">🌙 晚餐時間</div></div><div class="setting-val"><input type="time" id="t-di" value="19:00"/></div></div>
      <div class="setting-row"><div><div class="setting-label">🔒 新 PIN 碼</div></div><div class="setting-val"><input type="password" id="p-pin" placeholder="****" maxlength="4" inputmode="numeric"/></div></div>
      <div class="setting-row"><div><div class="setting-label">🔒 確認 PIN</div></div><div class="setting-val"><input type="password" id="p-pin2" placeholder="****" maxlength="4" inputmode="numeric"/></div></div>
    </div>
    <div style="padding:12px"><button class="btn-save" style="width:100%;padding:12px" onclick="saveSettings()">💾 儲存設定</button></div>
    <div class="card" id="bmi-card" style="display:none"><div class="card-title">📊 身體指數</div><div id="bmi-vals" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"></div></div>
    <div style="padding:0 12px 12px"><button class="btn-sm" onclick="pullFromSheets()" style="width:100%;padding:10px">☁️ 從 Sheets 恢復數據</button></div>
  </div>
</div>
<nav class="bnav" id="bnav">
  <button class="bnav-btn active" data-tab="t-home"><span class="icon">🏠</span>首頁</button>
  <button class="bnav-btn" data-tab="t-meal"><span class="icon">🥗</span>飲食</button>
  <button class="bnav-btn" data-tab="t-wo"><span class="icon">💪</span>運動</button>
  <button class="bnav-btn" data-tab="t-shop"><span class="icon">🛒</span>購物</button>
  <button class="bnav-btn" data-tab="t-settings"><span class="icon">⚙️</span>設定</button>

// ── PIN ──────────────────────────────────────────────────────
let pinBuf="",pinMode="check";
function loadPin(){return localStorage.getItem("myPin")||DEFAULT_PIN;}
function savePin(p){localStorage.setItem("myPin",p);}
function updateDots(){for(let i=0;i<4;i++){const d=document.getElementById("d"+i);d.classList.toggle("filled",i<pinBuf.length);d.classList.remove("error");}}
function pinPress(n){if(pinBuf.length>=4)return;pinBuf+=n;updateDots();if(pinBuf.length===4)setTimeout(doCheckPin,120);}
function pinDel(){if(pinBuf.length>0){pinBuf=pinBuf.slice(0,-1);updateDots();}}

function doCheckPin(){
  if(pinMode==="set"){
    savePin(pinBuf);pinBuf="";pinMode="check";updateDots();
    document.getElementById("pin-sub").textContent="輸入 4 位 PIN 碼";
    document.getElementById("pin-hint").textContent="";
    document.getElementById("pin-err").textContent="";
    return;
  }
  if(pinBuf===loadPin()){
    document.getElementById("pin-screen").style.display="none";
    document.getElementById("app").style.display="block";
    initApp();
  }else{
    for(let i=0;i<4;i++)document.getElementById("d"+i).classList.add("error");

    setTimeout(()=>{pinBuf="";updateDots();},700);

}

// ── Sheets sync ───────────────────────────────────────────────
async function syncSheets(action,data){
  try{
    const url=SCRIPT_URL+"?action="+encodeURIComponent(action)+"&data="+encodeURIComponent(JSON.stringify({action,...data}));
    const r=await fetch(url,{method:"GET",redirect:"follow"});
    const j=await r.json();
    setSS(j.success?"ok":"err");return j;
  }catch(e){setSS("err");return null;}
}
function setSS(s){
  const dot=document.getElementById("sdot"),txt=document.getElementById("stxt");
  if(!dot)return;
  if(s==="sync"){dot.style.background="var(--a4)";txt.textContent="同步中...";}
  else if(s==="ok"){dot.style.background="var(--a3)";txt.textContent="已同步";}
  else{dot.style.background="var(--a2)";txt.textContent="本地";}
}
async function pullFromSheets(){
  setSS("sync");
  const [wr,pr,sr]=await Promise.all([
    syncSheets("getBodyStats",{}),
    syncSheets("getProfile",{}),
    syncSheets("getShop",{key:"shop_all"})
  ]);
  let updated=false;
  if(wr&&wr.stats&&wr.stats.length){D.weights=wr.stats.map(s=>({date:s.date,wt:parseFloat(s.weight)||null})).filter(s=>s.wt).sort((a,b)=>b.date.localeCompare(a.date));saveWts();updated=true;}
  if(pr&&pr.profile){D.profile=pr.profile;D.planDays=parseInt(pr.profile.planDays)||90;savePf();loadPfUI();updated=true;}
  if(sr&&sr.data&&sr.data.shop){D.shop={...D.shop,...sr.data.shop};saveLocal();updated=true;}
  if(updated){renderHome();toast("✅ 已從 Sheets 恢復數據！");}
  else toast("Sheets 暫無數據","err");
}

// ── Helpers ───────────────────────────────────────────────────
function today(){return new Date().toISOString().slice(0,10);}
function dayNum(){const sd=D.profile&&D.profile.planStartDate;if(!sd)return null;const d=Math.floor((new Date(today())-new Date(sd))/86400000)+1;return d>0?d:null;}
function planPct(){const d=dayNum();if(!d)return 0;return Math.min(100,Math.round(d/D.planDays*100));}
function isWO(dow){return [0,2,5,6].includes(dow);}
function isCD(ds){const sd=D.profile&&D.profile.planStartDate;if(!sd)return false;const diff=Math.floor((new Date(ds)-new Date(sd))/86400000);return diff>0&&diff%14===13;}
function calcBMI(w,h){if(!w||!h)return null;return (w/((h/100)**2)).toFixed(1);}
function bmiLabel(b){if(!b)return"";if(b<18.5)return"偏輕";if(b<24)return"✓正常";if(b<28)return"偏重";return"肥胖";}
function calcTDEE(w,h){if(!w||!h)return null;return Math.round((10*w+6.25*h-5*30-161)*1.55);}
function getMT(){const p=D.profile||{};return{bk:p.tBk||"07:30",am:p.tAm||"10:30",lu:p.tLu||"12:30",pm:p.tPm||"15:30",di:p.tDi||"19:00"};}
function getCurrPlanWeek(){const d=dayNum();if(!d)return 0;return Math.floor((d-1)/7)%8;}
function getWeekRecipes(wi){return RECIPE_DB.filter(r=>r.week===wi);}
const DAY_NAMES=['日','一','二','三','四','五','六'];

// ── Phase system ──────────────────────────────────────────────
function getPhase(){
  const d=dayNum();if(!d)return null;
  const week=Math.ceil(d/7);
  if(week<=4)return{n:1,label:"第1階段",desc:"大缺口快速減脂",deficit:800,goal:0.8,color:"#ff6b6b"};
  if(week<=8)return{n:2,label:"第2階段",desc:"穩定持續減脂",deficit:600,goal:0.6,color:"#ffd166"};
  if(week<=12)return{n:3,label:"第3階段",desc:"保肌減脂",deficit:400,goal:0.4,color:"#43d99e"};
  return{n:4,label:"維持階段",desc:"防反彈塑型",deficit:200,goal:0.2,color:"#6c63ff"};
}

// 根據星期幾選擇早餐
// 週一/三/四 = id:0（便當日，簡單）
// 週二/五 = 輪替 id:1, id:3
// 週日/六 = id:2（訓練日豐富款）
function getBkByDay(dow){
  if([1,3,4].includes(dow)) return BREAKFASTS[0]; // 便當日：奶昔+蛋
  if(dow===2) return BREAKFASTS[1]; // 週二：奶昔+優格+奇異果
  if(dow===5) return BREAKFASTS[3]; // 週五：奶昔+蛋+蘋果
  if([0,6].includes(dow)) return BREAKFASTS[2]; // 週日/六（訓練日）：奶昔+燕麥+香蕉
  return BREAKFASTS[0];
}
function getBkLabel(dow){
  if([1,3,4].includes(dow)) return "早餐（便當日）";
  if([2,5].includes(dow)) return "早餐（在家日）";
  if([0,6].includes(dow)) return "早餐（訓練日）";
  return "早餐";
}

function renderWeekSummary(){
  const today_dow=new Date().getDay();
  const mon=new Date();mon.setDate(mon.getDate()-(today_dow===0?6:today_dow-1));
  const weekWts=D.weights.filter(w=>new Date(w.date)>=mon);
  const first=weekWts.length?weekWts[weekWts.length-1]:null;
  const last=weekWts.length?weekWts[0]:null;
  const wtChange=first&&last&&first!==last?(parseFloat(last.wt)-parseFloat(first.wt)).toFixed(1):null;
  const streak=calcStreak();
  document.getElementById("week-summary").innerHTML=`
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">

    </div>`;
}
function calcStreak(){
  if(!D.weights.length)return 0;
  const sorted=[...D.weights].sort((a,b)=>b.date.localeCompare(a.date));
  let n=0,cur=new Date(today());
  for(const w of sorted){const diff=Math.round((cur-new Date(w.date))/86400000);if(diff===0||diff===1){n++;cur=new Date(w.date);}else break;}
  return n;
}

function saveWeight(){

  const entry={date:today(),wt:v};
  const i=D.weights.findIndex(w=>w.date===today());
  if(i>=0)D.weights[i]=entry;else D.weights.unshift(entry);
  D.weights.sort((a,b)=>b.date.localeCompare(a.date));

}

// ── Shopping ─────────────────────────────────────────────────
function getWeekKey(off){const m=new Date();m.setDate(m.getDate()-m.getDay()+1+off*7);return m.toISOString().slice(0,10);}
function getShopRI(){
  if(!D.profile||!D.profile.planStartDate)return Math.abs(D.shopWeekOffset)%4;
  const ps=new Date(D.profile.planStartDate),sm=new Date();
  sm.setDate(sm.getDate()-sm.getDay()+1+D.shopWeekOffset*7);
  return Math.max(0,Math.floor((sm-ps)/604800000))%8;
}
function buildIngList(){
  const ri=getShopRI(),recs=getWeekRecipes(ri),seenBuy={},items=[];
  recs.forEach(r=>{
    if(r.dinner==="Cheat Dinner 🎉")return;
    r.ingredients.forEach(ing=>{
      const pu=INGREDIENT_UNIT[ing];
      const buyName=pu?pu.buy:ing+" (未知規格)";
      const cat=pu?pu.cat:"veg";
      if(!seenBuy[buyName]){seenBuy[buyName]=true;items.push({name:buyName,raw:ing,cat});}
    });
  });
  // Always include seasonings check
  ["薑","蒜","低鈉醬油","黑胡椒","橄欖油","檸檬"].forEach(s=>{
    const pu=INGREDIENT_UNIT[s];
    if(pu&&!seenBuy[pu.buy]){seenBuy[pu.buy]=true;items.push({name:pu.buy,raw:s,cat:"seasoning"});}
  });
  // Fixed weekly
  FIXED_WEEKLY.forEach(f=>{if(!seenBuy[f.name]){seenBuy[f.name]=true;items.push({name:f.name,raw:f.name,cat:f.cat});}});
  return items;
}
function ptKey(n){
  // Hash based on full string to avoid collisions
  let h=0;for(let i=0;i<n.length;i++){h=((h<<5)-h)+n.charCodeAt(i);h|=0;}
  return "pt_"+Math.abs(h).toString(36)+"_"+n.length;
}
function getPt(n){return D.shop[ptKey(n)]||"";}
function setPt(n,v){D.shop[ptKey(n)]=v;saveLocal();}
function byKey(n,wk){
  let h=0;for(let i=0;i<n.length;i++){h=((h<<5)-h)+n.charCodeAt(i);h|=0;}
  return "by_"+wk+"_"+Math.abs(h).toString(36)+"_"+n.length;
}
function isBought(n,wk){return !!D.shop[byKey(n,wk)];}
function setBought(n,wk,v){D.shop[byKey(n,wk)]=v;saveLocal();}

function renderShop(){
  const off=D.shopWeekOffset;
  const mon=new Date();mon.setDate(mon.getDate()-mon.getDay()+1+off*7);
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  document.getElementById("shop-week-lbl").textContent=off===0?"本週":off===1?"下週":off===-1?"上週":`${off>0?"+":""}${off}週`;
  document.getElementById("shop-week-range").textContent=`${mon.toLocaleDateString("zh-HK",{month:"short",day:"numeric"})} – ${sun.toLocaleDateString("zh-HK",{month:"short",day:"numeric"})}`;
  const ri=getShopRI();
  document.getElementById("shop-recipe-lbl").textContent=`第${ri+1}週食譜：`+getWeekRecipes(ri).map(r=>r.name).join("、");
  const items=buildIngList(),wk=getWeekKey(off);
  const grouped={};
  Object.keys(SHOP_CATS).forEach(c=>grouped[c]=[]);
  items.forEach(it=>{if(grouped[it.cat])grouped[it.cat].push(it);else grouped.veg.push(it);});
  let bought=0,total=0,skip=0,okC=0,lowC=0,outC=0;
  items.forEach(it=>{total++;const ps=getPt(it.name),b=isBought(it.name,wk);if(b)bought++;if(ps==="ok"&&!b)skip++;if(ps==="ok")okC++;if(ps==="low")lowC++;if(ps==="out")outC++;});
  document.getElementById("shop-stats").innerHTML=`
    <div class="shop-stat"><div class="v" style="color:#43d99e">${bought}</div><div class="l">本週已買</div></div>
    <div class="shop-stat"><div class="v" style="color:#ffd166">${total-bought-skip}</div><div class="l">待採購</div></div>
    <div class="shop-stat"><div class="v" style="color:#6c63ff">${okC}</div><div class="l">庫存充足</div></div>`;
  let html="";
  Object.entries(SHOP_CATS).forEach(([cat,{label,color}])=>{
    if(!grouped[cat]||!grouped[cat].length)return;
    html+=`<div class="shop-sec-title" style="color:${color}">${label}</div>`;
    grouped[cat].forEach(item=>{
      const ps=getPt(item.name),b=isBought(item.name,wk);
      const isOk=ps==="ok",isOut=ps==="out";
      html+=`<div class="shop-item ${b?"bought":""}">
        <input type="checkbox" ${b?"checked":""} onchange="setBoughtR('${item.name}','${item.raw}','${wk}',this.checked)">
        <span class="sname" style="${isOk&&!b?"opacity:.4;text-decoration:line-through":""}">${item.name}</span>
        ${isOk?`<span style="font-size:.64rem;color:#43d99e;margin-left:auto;flex-shrink:0">✓庫存充足</span>`:""}
        ${isOut?`<span style="font-size:.64rem;color:#ff6b6b;margin-left:auto;flex-shrink:0">→補買</span>`:""}
        <select class="pantry-sel" style="margin-left:${isOk||isOut?"4px":"auto"}" onchange="setPtR('${item.name}',this.value)">
          <option value="" ${!ps?"selected":""}>—</option>
          <option value="ok" ${ps==="ok"?"selected":""}>✓充足</option>
          <option value="low" ${ps==="low"?"selected":""}>⚠快用完</option>
          <option value="out" ${ps==="out"?"selected":""}>✕用完</option>
        </select>
      </div>`;
    });
  });
  document.getElementById("shop-list").innerHTML=html;
}
function setBoughtR(name,raw,wk,v){setBought(name,wk,v);saveLocal();renderShop();}
function setPtR(name,v){setPt(name,v);renderShop();}
function autoUpdatePantry(){
  const items=buildIngList(),wk=getWeekKey(D.shopWeekOffset);
  let c=0;
  items.forEach(it=>{if(isBought(it.name,wk)){setPt(it.name,"ok");c++;}});
  saveLocal();renderShop();showShopMsg("✅ "+c+" 項食材庫存更新為充足");
  // Sync shop data to Sheets
  setSS("sync");
  syncSheets("saveShop",{key:"shop_"+wk,data:{shop:D.shop}}).then(r=>setSS(r&&r.success?"ok":"err"));
}
function clearBuyList(){
  const wk=getWeekKey(D.shopWeekOffset);
  Object.keys(D.shop).forEach(k=>{if(k.startsWith("by_"+wk))delete D.shop[k];});
  saveLocal();renderShop();showShopMsg("🔄 本週採購清單已重置");
}
function saveShopToSheets(){
  const wk=getWeekKey(D.shopWeekOffset);
  setSS("sync");
  syncSheets("saveShop",{key:"shop_all",data:{shop:D.shop}}).then(r=>{
    setSS(r&&r.success?"ok":"err");
    showShopMsg(r&&r.success?"☁️ 購物清單已備份到 Sheets！":"❌ 備份失敗，請檢查網絡");
  });
}
function showShopMsg(msg){const el=document.getElementById("shop-msg");el.textContent=msg;el.style.display="block";setTimeout(()=>el.style.display="none",3000);}
function prevShopWeek(){D.shopWeekOffset--;renderShop();}
function nextShopWeek(){D.shopWeekOffset++;renderShop();}

// ── Settings ─────────────────────────────────────────────────
function loadPfUI(){
  if(!D.profile)return;
  const p=D.profile;
  if(p.planStartDate)document.getElementById("p-start").value=p.planStartDate;
  if(p.planDays)document.getElementById("p-days").value=p.planDays;
  if(p.height)document.getElementById("p-height").value=p.height;
  if(p.goalWeight)document.getElementById("p-goal").value=p.goalWeight;
  if(p.tBk)document.getElementById("t-bk").value=p.tBk;
  if(p.tAm)document.getElementById("t-am").value=p.tAm;
  if(p.tLu)document.getElementById("t-lu").value=p.tLu;
  if(p.tPm)document.getElementById("t-pm").value=p.tPm;
  if(p.tDi)document.getElementById("t-di").value=p.tDi;
  updateBMICard();
}
function updateBMICard(){
  const h=parseFloat(document.getElementById("p-height").value)||null;
  const lastWt=D.weights[0];const w=lastWt?parseFloat(lastWt.wt):null;
  if(!h||!w){document.getElementById("bmi-card").style.display="none";return;}
  document.getElementById("bmi-card").style.display="block";
  const bmi=calcBMI(w,h),tdee=calcTDEE(w,h);
  const ph=getPhase();
  const target=tdee&&ph?Math.max(1200,tdee-ph.deficit):null;
  document.getElementById("bmi-vals").innerHTML=`
    <div style="background:var(--sf);border-radius:9px;padding:10px;text-align:center"><div style="font-size:1.3rem;font-weight:700;font-family:'Space Grotesk',sans-serif">${bmi||"--"}</div><div style="font-size:.66rem;color:var(--mt)">BMI</div><div style="font-size:.7rem;margin-top:2px">${bmiLabel(bmi)}</div></div>
    <div style="background:var(--sf);border-radius:9px;padding:10px;text-align:center"><div style="font-size:1.3rem;font-weight:700;font-family:'Space Grotesk',sans-serif">${tdee?tdee.toLocaleString():"--"}</div><div style="font-size:.66rem;color:var(--mt)">TDEE kcal</div></div>
    <div style="background:var(--sf);border-radius:9px;padding:10px;text-align:center"><div style="font-size:1.3rem;font-weight:700;font-family:'Space Grotesk',sans-serif;color:${ph?ph.color:"var(--a3)"}">${target?target.toLocaleString():"--"}</div><div style="font-size:.66rem;color:var(--mt)">目標熱量</div></div>`;
}
function saveSettings(){
  const np1=document.getElementById("p-pin").value,np2=document.getElementById("p-pin2").value;
  if(np1){if(!/^\d{4}$/.test(np1)){toast("PIN必須是4位數字","err");return;}if(np1!==np2){toast("兩次PIN不一致","err");return;}savePin(np1);}
  D.profile={
    planStartDate:document.getElementById("p-start").value,
    planDays:parseInt(document.getElementById("p-days").value)||90,
    height:parseFloat(document.getElementById("p-height").value)||"",
    goalWeight:parseFloat(document.getElementById("p-goal").value)||"",
    tBk:document.getElementById("t-bk").value||"07:30",
    tAm:document.getElementById("t-am").value||"10:30",
    tLu:document.getElementById("t-lu").value||"12:30",
    tPm:document.getElementById("t-pm").value||"15:30",
    tDi:document.getElementById("t-di").value||"19:00",
  };
  D.planDays=D.profile.planDays;
  savePf();updateBMICard();renderHome();
  toast("✅ 設定已儲存！"+(np1?" PIN已更新。":""));
  syncSheets("saveProfile",{profile:D.profile}).then(r=>setSS(r&&r.success?"ok":"err"));
}

// ── Boot ─────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded",()=>{
  loadLocal();
  document.querySelectorAll("#pin-grid .pin-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const v=btn.getAttribute("data-pin");
      if(v==="del")pinDel();
      else if(v==="reset")pinReset();
      else pinPress(v);
    });
  });
  document.addEventListener("keydown",e=>{
    const ps=document.getElementById("pin-screen");
    if(ps&&ps.offsetParent!==null){
      if(/^\d$/.test(e.key))pinPress(e.key);
      if(e.key==="Backspace")pinDel();
    }
  });
  if(!localStorage.getItem("myPin")){
    document.getElementById("pin-sub").textContent="首次使用，請設定 PIN 碼";
    document.getElementById("pin-hint").textContent="輸入任意4位數字";
    pinMode="set";
  }
});
